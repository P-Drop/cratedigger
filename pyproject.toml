[project]
name = "cratedigger"
version = "0.1.0"
description = "API REST for Hip Hop archive and sampling registry"
authors = [
    { name = "P-Drop", email = "pedrorincon.tec@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "django-stubs[compatible-mypy]>=6.1.1",
    "factory-boy>=3.3.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]

# -------------
# Ruff

[tool.ruff]
# Ajusta longitud de linea a 88 caracteres
line-length = 88

# Añado a los directorios excluidos por defecto (.venv, .git, ...)
# el directorio de migraciones.
# Excluir la configuración local de claude (.claude) es redundante
# porque ruff respeta .gitignore.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes: imports y variables sin usar, nombres indefinidos
    "I",         # isort: orden de imports
    "UP",        # pyupgrade: sintaxis moderna según la version de Python
    "B",         # flake8-bugbear: bugs probables y malos patrones
    "SIM",       # simplificaciones de codigo
    "C4",        # comprehensions mas limpias
    "N",         # pep8-naming
    "PTH",       # pathlib en lugar de os.path
    "DTZ",       # datetimes con zona horaria
    "DJ",        # reglas especificas de Django
    "S",         # flake8-bandit: seguridad
    "T20",       # print / pprint
    "RUF"        # reglas propias de Ruff
]

ignore = [
    "E501",    # longitud de linea gestionada por el formateador
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]    # assert permitido en tests
"**/tests.py" = ["S101"]

[tool.ruff.format]
# Activa el formateo del código de ejemplo en docstrings
docstring-code-format = true

# -------------
# Mypy

[tool.mypy]
# Modo tipado estricto
strict = true

plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

# -------------
# Pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--import-mode=importlib",
    "-ra",
    # configuracion de cobertura temporal, despues ira solo en CI
    "--cov",
    "--cov-report=html",
    "--cov-fail-under=85",
]

[tool.coverage.run]
source = ["."]
omit =[
    "*/migrations/*",
    "*tests/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    "*/venv/*",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines =[
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
