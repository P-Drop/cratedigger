[project]
name = "cratedigger"
version = "0.1.0"
description = "API REST for Hip Hop archive and sampling registry"
authors = [
    { name = "P-Drop", email = "pedrorincon.tec@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "factory-boy>=3.3.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]
