default_install_hook_types:
  - pre-commit
  - commit-msg
  - post-checkout
  - post-merge
  - post-rewrite

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--enforce-all"]
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock
      - id: uv-sync
        args: ["--locked"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check
        args: [ --fix, --exit-non-zero-on-fix ]
        require_serial: true
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        require_serial: true
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # Añado el tipo de commit personalizado 'learn' para respuestas a Claude
        # en commits que no cambian el código.
        args: [build, chore, ci, docs, feat, fix, learn, perf, refactor, revert, style, test]


ci:
  # Hooks the CI workflow skips: gitleaks scans only staged files (the
  # full-history job replaces it) and uv-lock duplicates `uv sync --locked`.
  skip: [uv-lock, gitleaks]
