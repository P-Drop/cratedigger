name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

env:
  DJANGO_SECRET_KEY: ci
  POSTGRES_DB: ci
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  MONGO_DB: ci
  MONGO_USER: ci
  MONGO_PASSWORD: ci
# Enforce --locked on every uv command, including uv run inside hooks
  UV_LOCKED: 1

jobs:

  check-quality:
    name: Check code quality
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.python-version', '.pre-commit-config.yaml') }}

      - name: Install Uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: "./pyproject.toml"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install project
        run: uv sync

      - name: Pre-commit hooks
        run: |
          SKIP="$(uv run python -c 'import yaml; c = yaml.safe_load(open(".pre-commit-config.yaml")); print(",".join(c.get("ci", {}).get("skip", [])))')"
          export SKIP
          echo "Skipped in CI: ${SKIP:-none}"
          uv run pre-commit run --all-files --show-diff-on-failure

  detect-secrets:
    name: Detect leaked secrets
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/

      - name: Scan full history
        run: gitleaks git --redact --verbose

  unit-tests:
    name: Unit tests
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      COVERAGE_FILE: .coverage.unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: "./pyproject.toml"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install project
        run: uv sync

      - name: Run unit test suite
        run: uv run pytest -m "not integration" --cov-fail-under=0

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: ${{ env.COVERAGE_FILE }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  integration-tests:
    name: Integration tests
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      COVERAGE_FILE: .coverage.integration
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
      mongo:
        image: mongo:7.0.43-jammy@sha256:f71f6d0913c945096cd058557cbadf4ad435007f378d84b3c4c636c928735e72
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ env.MONGO_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ env.MONGO_PASSWORD }}
        ports:
          - "127.0.0.1:27017:27017"
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
          --health-start-interval 1s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: "./pyproject.toml"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install project
        run: uv sync

      - name: Run integration test suite
        run: uv run pytest -m integration --cov-fail-under=0

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: ${{ env.COVERAGE_FILE }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  check-coverage:
    name: Check coverage threshold
    needs: [unit-tests, integration-tests]
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: "./pyproject.toml"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install project
        run: uv sync

      - name: Download report artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-reports/
          merge-multiple: true

      - name: Combine reports
        run: uv run coverage combine coverage-reports/

      - name: Apply coverage threshold
        run: uv run coverage report

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

  check-commits:
    name: Check commit messages
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: "./pyproject.toml"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install project
        run: uv sync

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --merges "$BASE_SHA..$HEAD_SHA"); do
            echo "::error::Merge commit in branch, rebase onto main instead: ${sha:0:7} $(git log -1 --format=%s "$sha")"
            status=1
          done
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg"
            bash .github/scripts/check-message.sh "$RUNNER_TEMP/commit-msg" \
              "${sha:0:7} $(git log -1 --format=%s "$sha")" || status=1
          done
          exit "$status"
